[tool.poetry]
name = "app"
version = "0.1.0"
description = ""
authors = ["Devin AI <158243242+devin-ai-integration[bot]@users.noreply.github.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
fastapi = {extras = ["standard"], version = "^0.121.1"}
# Vector DB and Embeddings (FAISS + sentence-transformers)
faiss-cpu = "^1.8.0"
sentence-transformers = "^3.3.1"
# ML Models
diffusers = "^0.35.2"
transformers = "^4.46.0"
torch = "^2.9.0"
accelerate = "^1.11.0"
# Safety and Validation
detoxify = "^0.5.2"
nudenet = "^3.4.2"
# Image/Video Processing
pillow = "^12.0.0"
imageio = "^2.37.2"
imageio-ffmpeg = "^0.6.0"
opencv-python = "^4.10.0"
# Document Processing
pandas = "^2.3.3"
openpyxl = "^3.1.5"
pymupdf = "^1.25.1"
python-docx = "^1.1.2"
# Database
aiosqlite = "^0.20.0"
# Utilities
python-dotenv = "^1.2.1"
# ONNX Runtime for CPU fallback
onnxruntime = "^1.20.1"
optimum = {extras = ["onnxruntime"], version = "^1.23.3"}


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
pytest-asyncio = "^1.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
